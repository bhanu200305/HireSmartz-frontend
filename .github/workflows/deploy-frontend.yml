name: Deploy Frontend (Staging)

on:
  push:
    branches:
      - staging-branch
  workflow_dispatch:

jobs:
  calculate-tag:
    name: 🏷️ Calculate Version Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate SemVer Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          tag_prefix: "frontend-staging-"
          release_branches: staging-branch
          fetch_all_tags: true
          dry_run: false

  build-and-deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    needs: calculate-tag

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Decode & Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d -i > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Fetch ConfigMap from EKS & Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: cfp/frontend-service
          IMAGE_TAG: frontend-${{ needs.calculate-tag.outputs.tag }}
          NAMESPACE: careerforcestaging
          CONFIGMAP_NAME: careerforce-frontend-config
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building image: $IMAGE_URI"

          get_cm() {
            kubectl get configmap $CONFIGMAP_NAME -n $NAMESPACE -o jsonpath="{.data.$1}" 2>/dev/null || true
          }

          VITE_BACKEND_ENDPOINT=$(get_cm VITE_BACKEND_ENDPOINT)
          VITE_BACKEND_PREFIX=$(get_cm VITE_BACKEND_PREFIX)
          VITE_AUTH_SERVICE_ENDPOINT=$(get_cm VITE_AUTH_SERVICE_ENDPOINT)
          VITE_ORG_SERVICE_ENDPOINT=$(get_cm VITE_ORG_SERVICE_ENDPOINT)
          VITE_NOTIFICATION_SERVICE_ENDPOINT=$(get_cm VITE_NOTIFICATION_SERVICE_ENDPOINT)
          VITE_JOB_SERVICE_ENDPOINT=$(get_cm VITE_JOB_SERVICE_ENDPOINT)
          VITE_AI_SERVICE_ENDPOINT=$(get_cm VITE_AI_SERVICE_ENDPOINT)
          VITE_CANDIDATE_SERVICE_ENDPOINT=$(get_cm VITE_CANDIDATE_SERVICE_ENDPOINT)
          VITE_INTERVIEW_SERVICE_ENDPOINT=$(get_cm VITE_INTERVIEW_SERVICE_ENDPOINT)
          VITE_RECAPTCHA_SITE_KEY=$(get_cm VITE_RECAPTCHA_SITE_KEY)
          VITE_BYPASS_AUTH=$(get_cm VITE_BYPASS_AUTH)
          VITE_NYLAS_CLIENT_ID=$(get_cm VITE_NYLAS_CLIENT_ID)
          VITE_INTERVIEW_FEEDBACK_FEATURE=$(get_cm VITE_INTERVIEW_FEEDBACK_FEATURE)
          VITE_VIDEO_CONSENT_FEATURE=$(get_cm VITE_VIDEO_CONSENT_FEATURE)
          VITE_NYLAS_FEATURE=$(get_cm VITE_NYLAS_FEATURE)

          # Debug: print what EKS actually returned for auth endpoint
          echo "DEBUG VITE_AUTH_SERVICE_ENDPOINT: '$VITE_AUTH_SERVICE_ENDPOINT'"

          docker build \
            --build-arg VITE_BACKEND_ENDPOINT="$VITE_BACKEND_ENDPOINT" \
            --build-arg VITE_BACKEND_PREFIX="$VITE_BACKEND_PREFIX" \
            --build-arg VITE_AUTH_SERVICE_ENDPOINT="$VITE_AUTH_SERVICE_ENDPOINT" \
            --build-arg VITE_ORG_SERVICE_ENDPOINT="$VITE_ORG_SERVICE_ENDPOINT" \
            --build-arg VITE_NOTIFICATION_SERVICE_ENDPOINT="$VITE_NOTIFICATION_SERVICE_ENDPOINT" \
            --build-arg VITE_JOB_SERVICE_ENDPOINT="$VITE_JOB_SERVICE_ENDPOINT" \
            --build-arg VITE_AI_SERVICE_ENDPOINT="$VITE_AI_SERVICE_ENDPOINT" \
            --build-arg VITE_CANDIDATE_SERVICE_ENDPOINT="$VITE_CANDIDATE_SERVICE_ENDPOINT" \
            --build-arg VITE_INTERVIEW_SERVICE_ENDPOINT="$VITE_INTERVIEW_SERVICE_ENDPOINT" \
            --build-arg VITE_RECAPTCHA_SITE_KEY="$VITE_RECAPTCHA_SITE_KEY" \
            --build-arg VITE_BYPASS_AUTH="$VITE_BYPASS_AUTH" \
            --build-arg VITE_NYLAS_CLIENT_ID="$VITE_NYLAS_CLIENT_ID" \
            --build-arg VITE_INTERVIEW_FEEDBACK_FEATURE="$VITE_INTERVIEW_FEEDBACK_FEATURE" \
            --build-arg VITE_VIDEO_CONSENT_FEATURE="$VITE_VIDEO_CONSENT_FEATURE" \
            --build-arg VITE_NYLAS_FEATURE="$VITE_NYLAS_FEATURE" \
            -t $IMAGE_URI \
            -f Dockerfile .

          echo "Pushing image to ECR..."
          docker push $IMAGE_URI
          docker tag $IMAGE_URI "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE_FULL_NAME=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Staging Kubernetes Cluster
        run: |
          NAMESPACE="careerforcestaging"
          echo "Deploying to namespace: $NAMESPACE"
          echo "Image: $IMAGE_FULL_NAME"

          kubectl set image deployment/careerforce-frontend careerforce-frontend=$IMAGE_FULL_NAME -n $NAMESPACE
          kubectl rollout status deployment/careerforce-frontend -n $NAMESPACE --timeout=180s
